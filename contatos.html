<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contato — Melodia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style/styles.css">
</head>
<body class="bg-[#F6F3FF] text-[#14102B]">

  <!-- Cabeçalho -->
  <header class="bg-[#14102B] text-white py-10 px-4 text-center sm:py-12 sm:px-6 lg:py-16">
    <h1 class="font-titulo font-bold text-2xl sm:text-3xl lg:text-4xl">Fale com a gente</h1>
    <p class="mt-3 text-[#B9A8FF] text-sm sm:text-base max-w-md mx-auto">Dúvidas, sugestões ou quer receber novidades? Preencha o formulário.</p>
  </header>

  <!-- Conteúdo principal: formulário + informações -->
  <main class="max-w-4xl mx-auto px-4 py-10 sm:px-6 sm:py-12 lg:py-16 grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-10">

    <!-- Formulário de contato -->
    <form class="bg-white rounded-2xl p-6 sm:p-8 space-y-4">
      <h2 class="font-titulo font-medium text-xl sm:text-2xl mb-2">Envie sua mensagem</h2>

      <div>
        <label class="block text-sm mb-1">Nome</label>
        <input type="text" placeholder="Seu nome" class="w-full rounded-xl bg-[#F6F3FF] border border-[#14102B]/10 px-4 py-3">
      </div>

      <div>
        <label class="block text-sm mb-1">E-mail</label>
        <input type="email" placeholder="nome@email.com" class="w-full rounded-xl bg-[#F6F3FF] border border-[#14102B]/10 px-4 py-3">
      </div>

      <div>
        <label class="block text-sm mb-1">Assunto</label>
        <select class="w-full rounded-xl bg-[#F6F3FF] border border-[#14102B]/10 px-4 py-3">
          <option>Dúvida</option>
          <option>Sugestão</option>
          <option>Parceria</option>
          <option>Quero receber novidades</option>
        </select>
      </div>

      <div>
        <label class="block text-sm mb-1">Mensagem</label>
        <textarea rows="4" placeholder="Escreva aqui sua mensagem" class="w-full rounded-xl bg-[#F6F3FF] border border-[#14102B]/10 px-4 py-3"></textarea>
      </div>

      <button type="submit" class="w-full bg-[#FF3D9A] text-white font-medium py-3 rounded-full">
        Enviar mensagem
      </button>
    </form>

    <!-- Informações de contato -->
    <div class="space-y-4">
      <div class="bg-white rounded-2xl p-5 sm:p-6 flex items-center gap-4">
        <i class="fa-solid fa-envelope text-[#6D3BF5] text-xl w-8 text-center"></i>
        <div>
          <p class="font-titulo font-medium">E-mail</p>
          <p class="text-sm text-[#14102B]/70">contato@melodia.app</p>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-5 sm:p-6 flex items-center gap-4">
        <i class="fa-solid fa-phone text-[#6D3BF5] text-xl w-8 text-center"></i>
        <div>
          <p class="font-titulo font-medium">Telefone</p>
          <p class="text-sm text-[#14102B]/70">(11) 4000-0000</p>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-5 sm:p-6 flex items-center gap-4">
        <i class="fa-solid fa-location-dot text-[#6D3BF5] text-xl w-8 text-center"></i>
        <div>
          <p class="font-titulo font-medium">Endereço</p>
          <p class="text-sm text-[#14102B]/70">Av. da Música, 123 — São Paulo, SP</p>
        </div>
      </div>

      <div class="bg-[#14102B] rounded-2xl p-5 sm:p-6">
        <p class="font-titulo font-medium text-white mb-3">Siga a Melodia</p>
        <div class="flex gap-4 text-lg text-[#B9A8FF]">
          <i class="fa-brands fa-instagram"></i>
          <i class="fa-brands fa-tiktok"></i>
          <i class="fa-brands fa-spotify"></i>
          <i class="fa-brands fa-x-twitter"></i>
        </div>
      </div>
    </div>

  </main>

  <!-- Rodapé -->
  <footer class="bg-[#14102B] py-6 text-center text-[#B9A8FF]/60 text-xs px-4">
    © 2026 Melodia. Todos os direitos reservados.
  </footer>

</body>
</html>
